<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071629">
  <title>مهرازهوش | خوش آمدید</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Tahoma, Arial, sans-serif;
      color: #fff;
      text-align: center;
      background:
        radial-gradient(circle at 50% 25%, #173d60 0, transparent 42%),
        linear-gradient(145deg, #06101f, #102b43 60%, #071629);
    }
    .welcome {
      width: 100%;
      max-width: 480px;
      padding: 30px 24px 36px;
      border: 1px solid rgba(120, 210, 255, .22);
      border-radius: 28px;
      background: rgba(255,255,255,.055);
      box-shadow: 0 20px 70px rgba(0,0,0,.3);
    }
    .mascot {
      width: min(78%, 290px);
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 24px rgba(40,190,255,.3));
    }
    h1 {
      margin: 12px 0 4px;
      font-size: 30px;
      color: #fff;
      letter-spacing: 1px;
    }
    .mai {
      direction: ltr;
      color: #63d7ff;
      font-size: 13px;
      letter-spacing: 6px;
      margin-bottom: 24px;
    }
    .description {
      color: #d5e5f0;
      font-size: 15px;
      line-height: 2;
      margin: 0 auto 28px;
    }
    .enter {
      display: block;
      width: 100%;
      padding: 16px 18px;
      border-radius: 15px;
      color: #061629;
      background: linear-gradient(90deg, #55d8ff, #a1f0ff);
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 8px 25px rgba(50,190,255,.2);
    }
    .enter:active { transform: scale(.98); }
    .subtitle {
      margin-top: 17px;
      color: #a9c2d5;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="welcome">
    <img
      class="mascot"
      src="https://raw.githubusercontent.com/saramiali08-lang/Mehrazhosh/main/Futuristic%20Neon%20M%20Learning%20Mascot.png"
      alt="ماسکات مهرازهوش"
    >
    <h1>مهرازهوش</h1>
    <div class="mai">MAI</div>
    <p class="description">
      به دنیای یادگیری و خلاقیت با هوش مصنوعی خوش آمدید.
    </p>
    <a class="enter" href="./index.html">
      ورود به سامانه آموزشی
    </a>
    <div class="subtitle">ثبت‌نام و ورود هنرجویان</div>
  </main>
</body>
</html>
